<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 CineSnack · movie tickets + snacks</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: rgba(22, 28, 40, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 30px 35px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 100, 0.1);
            border: 1px solid rgba(255, 220, 120, 0.15);
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #f5e7c8;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        h1 span {
            background: #f5b042;
            color: #0b0f1c;
            font-size: 1.2rem;
            border-radius: 60px;
            padding: 4px 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .subhead {
            color: #b9c2d4;
            margin-bottom: 28px;
            font-weight: 400;
            border-left: 3px solid #f5b042;
            padding-left: 16px;
            font-size: 1.05rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 30px;
        }
        @media (max-width: 780px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .app {
                padding: 22px;
            }
            h1 {
                font-size: 1.9rem;
            }
        }
        .panel {
            background: #1b212e;
            border-radius: 32px;
            padding: 24px 26px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 10px 20px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #2f384b;
        }
        .panel h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #e9eef7;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.2px;
        }
        .panel h2 i {
            font-style: normal;
            background: #f5b04220;
            color: #f5b042;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }
        .movie-option {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #0f131e;
            padding: 12px 18px;
            border-radius: 60px;
            border: 1.5px solid #2d3548;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #cdd6e9;
            font-weight: 500;
        }
        .movie-option.selected {
            border-color: #f5b042;
            background: #1e2538;
            box-shadow: 0 0 0 2px #f5b04230, 0 8px 16px -6px #00000080;
            color: #ffffff;
        }
        .movie-option input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #47526b;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            flex-shrink: 0;
        }
        .movie-option input[type="radio"]:checked {
            border-color: #f5b042;
            background: #f5b042;
            box-shadow: inset 0 0 0 4px #1b212e;
        }
        .movie-info {
            display: flex;
            flex-direction: column;
        }
        .movie-title {
            font-weight: 600;
            font-size: 1.05rem;
        }
        .movie-meta {
            font-size: 0.75rem;
            color: #8e9bb0;
            letter-spacing: 0.3px;
        }
        .showtime-section {
            margin-top: 12px;
        }
        .showtime-section h3 {
            color: #b9c2d4;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .showtimes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .showtime-btn {
            background: #0f131e;
            border: 1.5px solid #2d3548;
            color: #cdd6e9;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .showtime-btn.selected {
            background: #f5b042;
            border-color: #f5b042;
            color: #0b0f1c;
            box-shadow: 0 6px 12px -4px #f5b04270;
        }
        .showtime-btn:hover {
            border-color: #f5b04280;
        }
        .seat-section {
            margin-top: 24px;
        }
        .seat-section h3 {
            color: #b9c2d4;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .seat-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .seat-btn {
            background: #0f131e;
            border: 1.5px solid #2d3548;
            color: #cdd6e9;
            width: 58px;
            height: 58px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            line-height: 1;
        }
        .seat-btn small {
            font-size: 0.55rem;
            font-weight: 400;
            color: #8e9bb0;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }
        .seat-btn.selected {
            background: #f5b042;
            border-color: #f5b042;
            color: #0b0f1c;
            box-shadow: 0 8px 14px -6px #f5b04290;
        }
        .seat-btn.selected small {
            color: #1e1e1e;
        }
        .snack-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 6px;
        }
        .snack-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f131e;
            padding: 10px 18px;
            border-radius: 60px;
            border: 1.5px solid #2d3548;
            transition: 0.1s;
        }
        .snack-item.selected {
            border-color: #f5b04280;
            background: #1e2538;
        }
        .snack-label {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e0e6f0;
            font-weight: 500;
        }
        .snack-label input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #47526b;
            border-radius: 8px;
            background: #0b0f1c;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        .snack-label input[type="checkbox"]:checked {
            background: #f5b042;
            border-color: #f5b042;
        }
        .snack-label input[type="checkbox"]:checked::after {
            content: "✓";
            color: #0b0f1c;
            font-weight: 800;
            display: block;
            line-height: 1;
        }
        .snack-price {
            color: #f5b042;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }
        .summary-panel {
            margin-top: 28px;
            background: #0d1220;
            border-radius: 28px;
            padding: 24px 28px;
            border: 1px solid #2c3549;
            box-shadow: inset 0 2px 5px #00000030;
        }
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            border-bottom: 1px dashed #2d3548;
            padding-bottom: 14px;
        }
        .summary-header h3 {
            color: #e9eef7;
            font-weight: 600;
            font-size: 1.3rem;
        }
        .total-badge {
            background: #f5b042;
            color: #0b0f1c;
            font-weight: 800;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1.4rem;
            letter-spacing: -0.3px;
        }
        .summary-line {
            display: flex;
            justify-content: space-between;
            color: #b9c2d4;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .summary-line strong {
            color: #e9eef7;
            font-weight: 600;
        }
        .summary-line.total-line {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #2d3548;
            font-weight: 700;
            color: #f5e7c8;
            font-size: 1.1rem;
        }
        .btn-book {
            background: #f5b042;
            border: none;
            color: #0b0f1c;
            width: 100%;
            padding: 18px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            box-shadow: 0 12px 24px -10px #f5b042b0;
        }
        .btn-book:hover {
            background: #ffc35c;
            transform: scale(1.01);
        }
        .btn-book:active {
            transform: scale(0.98);
        }
        .confirmation-msg {
            margin-top: 12px;
            color: #91e0a8;
            font-size: 0.9rem;
            text-align: center;
            min-height: 24px;
            font-weight: 500;
        }
        .empty-note {
            color: #6b7a94;
            font-size: 0.9rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>
            🍿 CineSnack
            <span>+ snacks</span>
        </h1>
        <div class="subhead">Pick a movie, showtime, seats & snacks — book in seconds</div>

        <div class="grid">
            <!-- LEFT PANEL: MOVIE + SHOWTIME + SEATS -->
            <div class="panel">
                <h2><i>🎬</i> Now showing</h2>
                <div class="movie-list" id="movieList">
                    <!-- injected via JS -->
                </div>

                <div class="showtime-section">
                    <h3>⏰ Showtime</h3>
                    <div class="showtimes" id="showtimeContainer">
                        <!-- dynamic -->
                    </div>
                </div>

                <div class="seat-section">
                    <h3>🪑 Seats (per person)</h3>
                    <div class="seat-buttons" id="seatContainer">
                        <!-- dynamic -->
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL: SNACKS + SUMMARY -->
            <div class="panel">
                <h2><i>🍿</i> Snack bar</h2>
                <div class="snack-grid" id="snackContainer">
                    <!-- dynamic snacks -->
                </div>

                <!-- SUMMARY INSIDE SAME PANEL -->
                <div class="summary-panel">
                    <div class="summary-header">
                        <h3>Your order</h3>
                        <div class="total-badge" id="totalAmount">₹0</div>
                    </div>
                    <div id="summaryDetails">
                        <!-- dynamic lines -->
                    </div>
                    <button class="btn-book" id="bookBtn">Confirm booking</button>
                    <div class="confirmation-msg" id="confirmationMsg"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- DATA -----
            const movies = [
                { id: 'm1', title: 'Dune: Part Two', meta: 'Sci-Fi · 2h 46m', price: 320 },
                { id: 'm2', title: 'Oppenheimer', meta: 'Drama · 3h 0m', price: 280 },
                { id: 'm3', title: 'Spider-Verse', meta: 'Animation · 2h 20m', price: 240 },
                { id: 'm4', title: 'The Batman', meta: 'Action · 2h 56m', price: 300 }
            ];

            const showtimes = ['10:30 AM', '1:45 PM', '5:20 PM', '9:00 PM'];

            const seats = [
                { code: 'A1', label: 'A1', type: 'standard' },
                { code: 'A2', label: 'A2', type: 'standard' },
                { code: 'A3', label: 'A3', type: 'standard' },
                { code: 'B1', label: 'B1', type: 'premium' },
                { code: 'B2', label: 'B2', type: 'premium' },
                { code: 'B3', label: 'B3', type: 'premium' }
            ];

            const snacks = [
                { id: 'popcorn', name: '🍿 Large Popcorn', price: 380 },
                { id: 'nachos', name: '🧀 Nachos & Cheese', price: 320 },
                { id: 'coke', name: '🥤 Soft Drink (Large)', price: 220 },
                { id: 'candy', name: '🍫 Chocolate Candy', price: 180 }
            ];

            // ----- STATE -----
            let state = {
                selectedMovieId: movies[0].id,
                selectedShowtime: showtimes[1],   // default 1:45 PM
                selectedSeats: ['A1'],            // one seat selected by default
                selectedSnacks: new Set(['popcorn']) // popcorn pre-selected for fun
            };

            // ----- DOM refs -----
            const movieListEl = document.getElementById('movieList');
            const showtimeContainer = document.getElementById('showtimeContainer');
            const seatContainer = document.getElementById('seatContainer');
            const snackContainer = document.getElementById('snackContainer');
            const summaryDetails = document.getElementById('summaryDetails');
            const totalAmountEl = document.getElementById('totalAmount');
            const bookBtn = document.getElementById('bookBtn');
            const confirmationMsg = document.getElementById('confirmationMsg');

            // helper: get selected movie object
            function getSelectedMovie() {
                return movies.find(m => m.id === state.selectedMovieId);
            }

            // helper: compute total price
            function computeTotal() {
                const movie = getSelectedMovie();
                const moviePrice = movie ? movie.price : 0;
                const seatCount = state.selectedSeats.length;
                const movieTotal = moviePrice * seatCount;

                let snacksTotal = 0;
                snacks.forEach(snack => {
                    if (state.selectedSnacks.has(snack.id)) {
                        snacksTotal += snack.price;
                    }
                });

                return { movieTotal, snacksTotal, total: movieTotal + snacksTotal, seatCount, moviePrice };
            }

            // ----- RENDER MOVIES -----
            function renderMovies() {
                movieListEl.innerHTML = '';
                movies.forEach(movie => {
                    const label = document.createElement('label');
                    label.className = `movie-option ${state.selectedMovieId === movie.id ? 'selected' : ''}`;
                    label.innerHTML = `
                        <input type="radio" name="movie" value="${movie.id}" ${state.selectedMovieId === movie.id ? 'checked' : ''}>
                        <div class="movie-info">
                            <span class="movie-title">${movie.title}</span>
                            <span class="movie-meta">${movie.meta} · ₹${movie.price}</span>
                        </div>
                    `;
                    // event listener
                    const radio = label.querySelector('input');
                    radio.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            state.selectedMovieId = movie.id;
                            renderMovies();          // re-render to update selected class
                            updateSummary();
                        }
                    });
                    movieListEl.appendChild(label);
                });
            }

            // ----- RENDER SHOWTIMES -----
            function renderShowtimes() {
                showtimeContainer.innerHTML = '';
                showtimes.forEach(time => {
                    const btn = document.createElement('button');
                    btn.className = `showtime-btn ${state.selectedShowtime === time ? 'selected' : ''}`;
                    btn.innerHTML = `⏰ ${time}`;
                    btn.addEventListener('click', () => {
                        state.selectedShowtime = time;
                        renderShowtimes();
                        updateSummary();
                    });
                    showtimeContainer.appendChild(btn);
                });
            }

            // ----- RENDER SEATS (multi-select) -----
            function renderSeats() {
                seatContainer.innerHTML = '';
                seats.forEach(seat => {
                    const btn = document.createElement('button');
                    const isSelected = state.selectedSeats.includes(seat.code);
                    btn.className = `seat-btn ${isSelected ? 'selected' : ''}`;
                    btn.innerHTML = `${seat.label}<small>${seat.type === 'premium' ? '★' : ''}</small>`;
                    btn.addEventListener('click', () => {
                        if (state.selectedSeats.includes(seat.code)) {
                            // remove seat (but keep at least one seat selected? we allow zero? let's allow zero but warn in summary)
                            state.selectedSeats = state.selectedSeats.filter(s => s !== seat.code);
                        } else {
                            state.selectedSeats.push(seat.code);
                        }
                        renderSeats();
                        updateSummary();
                    });
                    seatContainer.appendChild(btn);
                });
            }

            // ----- RENDER SNACKS (checkboxes) -----
            function renderSnacks() {
                snackContainer.innerHTML = '';
                snacks.forEach(snack => {
                    const isChecked = state.selectedSnacks.has(snack.id);
                    const div = document.createElement('div');
                    div.className = `snack-item ${isChecked ? 'selected' : ''}`;
                    div.innerHTML = `
                        <label class="snack-label">
                            <input type="checkbox" value="${snack.id}" ${isChecked ? 'checked' : ''}>
                            ${snack.name}
                        </label>
                        <span class="snack-price">₹${snack.price}</span>
                    `;
                    const checkbox = div.querySelector('input');
                    checkbox.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            state.selectedSnacks.add(snack.id);
                        } else {
                            state.selectedSnacks.delete(snack.id);
                        }
                        renderSnacks();   // update selected class
                        updateSummary();
                    });
                    // also make the whole div clickable? optional: keep clean
                    snackContainer.appendChild(div);
                });
            }

            // ----- UPDATE SUMMARY & TOTAL -----
            function updateSummary() {
                const movie = getSelectedMovie();
                const { movieTotal, snacksTotal, total, seatCount, moviePrice } = computeTotal();

                // build summary lines
                let html = '';

                // movie & showtime
                html += `<div class="summary-line"><span>🎬 ${movie ? movie.title : '—'}</span> <strong>${state.selectedShowtime}</strong></div>`;

                // seats
                const seatsDisplay = state.selectedSeats.length ? state.selectedSeats.join(', ') : 'no seats selected';
                html += `<div class="summary-line"><span>🪑 Seats (${seatCount})</span> <strong>${seatsDisplay}</strong></div>`;
                if (seatCount > 0) {
                    html += `<div class="summary-line"><span>   ${seatCount} × ₹${moviePrice}</span> <strong>₹${movieTotal}</strong></div>`;
                } else {
                    html += `<div class="summary-line empty-note">⚠️ Please select at least one seat</div>`;
                }

                // snacks
                if (state.selectedSnacks.size > 0) {
                    snacks.forEach(snack => {
                        if (state.selectedSnacks.has(snack.id)) {
                            html += `<div class="summary-line"><span>🍿 ${snack.name}</span> <strong>₹${snack.price}</strong></div>`;
                        }
                    });
                } else {
                    html += `<div class="summary-line empty-note">No snacks selected</div>`;
                }

                // total line (if total >0 or zero)
                html += `<div class="summary-line total-line"><span>Total</span> <strong>₹${total}</strong></div>`;

                summaryDetails.innerHTML = html;
                totalAmountEl.textContent = `₹${total}`;

                // disable book button if no seats or total 0? 
                if (state.selectedSeats.length === 0) {
                    bookBtn.disabled = true;
                    bookBtn.style.opacity = '0.5';
                    bookBtn.style.cursor = 'not-allowed';
                } else {
                    bookBtn.disabled = false;
                    bookBtn.style.opacity = '1';
                    bookBtn.style.cursor = 'pointer';
                }

                // clear confirmation message when summary changes
                confirmationMsg.textContent = '';
            }

            // ----- BOOKING ACTION -----
            function handleBooking() {
                if (state.selectedSeats.length === 0) {
                    confirmationMsg.textContent = '❌ Please select at least one seat.';
                    return;
                }
                const movie = getSelectedMovie();
                const { total } = computeTotal();
                const seatList = state.selectedSeats.join(', ');
                const snackCount = state.selectedSnacks.size;
                confirmationMsg.textContent = `✅ Booked "${movie.title}" at ${state.selectedShowtime} | seats: ${seatList} | total ₹${total} (${snackCount} snack${snackCount !== 1 ? 's' : ''})`;
                // optional: reset? no, keep as is.
                // you can also clear some selections but we keep for demo.
            }

            // ----- INITIAL RENDER + EVENT BINDING -----
            function init() {
                renderMovies();
                renderShowtimes();
                renderSeats();
                renderSnacks();
                updateSummary();

                bookBtn.addEventListener('click', handleBooking);
            }

            init();
        })();
    </script>
</body>
</html>
